name: Deploy lessons to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -R assets "5 клас" "6 клас" "7 клас" _site/
      - name: Exclude presentation files
        run: find _site -type f \( -iname '*.ppt' -o -iname '*.pptx' -o -iname '*.pps' -o -iname '*.ppsx' -o -iname '*.pot' -o -iname '*.potx' \) -delete
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
